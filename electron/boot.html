<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>MS Orchestrator</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; height: 100vh; display: grid; place-items: center;
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        background: Canvas; color: CanvasText;
      }
      main { max-width: 34rem; padding: 2rem; text-align: center; }
      button {
        margin-top: 1.25rem; padding: .55rem 1rem; font: inherit; font-size: .85rem; font-weight: 600;
        border-radius: 999px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer;
      }
      button[disabled] { opacity: .5; cursor: default; }
      #action { display: none; }
      #result { margin-top: .75rem; font-size: .8rem; white-space: pre-wrap; opacity: .85; }
      h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 .5rem; }
      p { margin: 0; line-height: 1.6; font-size: .9rem; opacity: .8; }
      ul { text-align: left; font-size: .85rem; line-height: 1.8; opacity: .85; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }
      .dot { display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: currentColor; margin-right: .5rem; opacity: .5; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"><span class="dot"></span>서버를 확인하는 중이에요</h1>
      <p id="detail">이미 실행 중인 서버가 있으면 새로 띄우지 않고 연결합니다.</p>
      <button id="action" type="button">WSL 에 설치하기</button>
      <p id="result"></p>
    </main>
    <script>
      const params0 = new URLSearchParams(location.search)
      const isWindows = params0.get('platform') === 'win32'

      // No progress bar: every state here reflects a real health check result,
      // never a timer pretending to be one.
      const STATES = {
        checking: {
          title: '서버를 확인하는 중이에요',
          detail: '이미 실행 중인 서버가 있으면 새로 띄우지 않고 연결합니다.',
        },
        starting: {
          title: '서버를 시작하는 중이에요',
          detail: '처음 실행하거나 WSL 이 막 깨어난 경우 수십 초까지 걸릴 수 있어요. 실제 응답을 기다리는 중입니다.',
        },
        'failed:binary-not-found': {
          title: 'cao-server 를 찾지 못했어요',
          // Where to look differs by platform, and pointing a Windows user at a
          // POSIX PATH sends them to the wrong machine entirely: on Windows the
          // server runs inside WSL, so the Windows PATH says nothing about it.
          detail: isWindows
            ? 'WSL 안에서 <code>cao-server</code> 를 찾지 못했습니다. WSL 터미널에서 ' +
              '<code>cao-server --help</code> 가 동작하는지 확인해 주세요. 아직 설치 전이라면 ' +
              // Deliberately not `uv tool install cli-agent-orchestrator`: that pulls
              // upstream CAO from PyPI, not this fork. Install from the checkout.
              '저장소 체크아웃에서 <code>uv tool install .</code> 로 설치하거나, ' +
              '<code>PYTHONPATH=src uv run cao-server</code> 로 직접 띄우면 앱이 연결합니다.'
            : 'PATH 와 <code>~/.local/bin</code>, uv tool 설치 위치를 확인했지만 실행 파일이 없습니다. ' +
              '터미널에서 <code>cao-server --help</code> 가 동작하는지 확인해 주세요.',
        },
        'failed:no-free-port': {
          title: '사용할 수 있는 포트가 없어요',
          detail:
            '9889 부터 차례로 확인했지만 모두 다른 프로그램이 쓰고 있습니다. ' +
            '해당 포트를 비우거나 다른 포트를 지정해 주세요.',
        },
        'failed:no-response': {
          title: '서버가 응답하지 않아요',
          detail: '서버 프로세스는 시작했지만 <code>/health</code> 가 응답하지 않았습니다. 로그를 확인해 주세요.',
        },
      }

      const state = params0.get('state') || 'checking'
      const copy = STATES[state] || STATES.checking
      document.getElementById('title').innerHTML = '<span class="dot"></span>' + copy.title
      document.getElementById('detail').innerHTML = copy.detail

      // The shell ships the window, not the server, so "not installed" is the
      // expected first-run state rather than a fault. Offer the install here
      // instead of asking the user to go find a terminal — but only when the
      // bridge can actually perform it.
      const action = document.getElementById('action')
      const result = document.getElementById('result')
      if (state === 'failed:binary-not-found' && typeof window.caoNative?.installServer === 'function') {
        action.style.display = 'inline-block'
        action.addEventListener('click', async () => {
          action.disabled = true
          result.textContent = '폴더를 고른 뒤 설치합니다…'
          const r = await window.caoNative.installServer()
          if (r.cancelled) {
            result.textContent = ''
            action.disabled = false
            return
          }
          result.textContent = r.message
          if (!r.ok) action.disabled = false
        })
      }
    </script>
  </body>
</html>
